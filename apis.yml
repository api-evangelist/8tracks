name: 8Tracks
description: >-
  8tracks was a San Francisco-based internet radio and social music-streaming
  service that let people create and share handcrafted playlists ("mixes") of at
  least eight tracks, discover mixes by mood, activity, genre, and tag, and play
  them back through the web, iOS, and Android apps. Founded in 2008, it grew to
  more than eight million monthly listeners by 2014 before declining. 8tracks
  published a public REST API (v2/v3) that exposed mix discovery, playback token
  sessions, track skip/report events, and user likes/favorites, but stopped
  issuing new API keys in February 2015. The company ceased operations on
  December 31, 2019, briefly relaunched under BackBeat Inc. in April 2020, and
  the service has been inactive since. This profile documents the historical API
  surface and web properties.

apis:
- name: 8tracks API v3
  description: >-
    Historical public REST API for the 8tracks internet-radio platform. Exposes
    mix discovery and search, per-session play tokens, playback control
    (play/next/skip/report), similar-mix recommendation, and authenticated user
    actions (likes, track favorites). Responses are available in JSON, XML, and
    JSONP. New API keys have not been issued since February 2015 and the service
    is inactive.
